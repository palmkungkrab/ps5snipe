name: PS5 stock watch

# GitHub's minimum schedule is every 5 minutes (runs often start a few minutes late). ok
# cron-job.org starts a run every 5 minutes. Each run keeps checking for RUN_SECONDS, so Sony is
# polled ~every 30s and JIB ~every 60s. 6 minutes > 5, so the next run is already checking
# before this one stops: no blind gap (start-up takes 20-60 s).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:        # "Run workflow" button for a manual test
    inputs:
      test_sites:
        description: 'One-off test: comma-separated site names from config.yaml (e.g. "Powerbuy,Banana IT"). Empty = normal watch.'
        required: false
        default: ""

# watch runs overlap on purpose: each one gets its own group, so a new run starts up while the
# previous one is still checking (a drop during the overlap may ping twice - better than a miss).
# one-off tests share one group, so they queue behind each other and never touch watch runs.
concurrency:
  group: ps5snipe-${{ inputs.test_sites != '' && 'test' || format('watch-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  RUN_SECONDS: "360"
  # Powerbuy / Banana / dotlife block GitHub's servers, so only these are checked here.
  SITES: '--site "Sony Store TH" --site JIB'

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # state.json remembers what was already announced, so you aren't re-pinged every run
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: ps5state-${{ github.run_id }}
          restore-keys: ps5state-

      - name: Check stock
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          TEST_SITES: ${{ inputs.test_sites }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "::error::Add the DISCORD_WEBHOOK_URL secret (Settings > Secrets and variables > Actions)"; exit 1; fi
          if [ -n "$TEST_SITES" ]; then
            args=(); IFS=',' read -ra names <<< "$TEST_SITES"
            for n in "${names[@]}"; do args+=(--site "$(echo "$n" | xargs)"); done
            python -m ps5snipe "${args[@]}" --once -v --debug-dir debug
          else
            eval python -m ps5snipe $SITES --duration "$RUN_SECONDS" --no-start-message --warn-after 10
          fi

      - name: Upload debug pages (tests only)
        if: always() && inputs.test_sites != ''
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages
          path: debug/
          if-no-files-found: ignore

      - name: Save state
        if: always() && inputs.test_sites == '' && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: ps5state-${{ github.run_id }}
