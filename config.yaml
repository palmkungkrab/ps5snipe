# ps5snipe configuration
interval_seconds: 60        # default time between checks of each site (randomised +-15%)
renotify_minutes: 15        # while something stays in stock, ping again every N minutes (0 = only once)
notify_sold_out: false      # also post (without ping) when an item sells out again
warn_after_failures: 5      # post a warning if a site fails/blocks this many times in a row
state_file: state.json

browser:
  headless: true            # set false (or use --headful) if a site keeps showing Cloudflare
  # channel: chrome         # use your installed Google Chrome instead of Playwright's Chromium
  profile_dir: browser-profile
  block_images: true

# What counts as a "PS5 console". Defaults live in ps5snipe/matching.py.
# match:
#   extra_exclude: ["pro"]   # e.g. ignore the PS5 Pro

# Site types:
#   shopify : Shopify stores, read via their public products.json feed (no browser needed)
#   browser : any other shop; a headless Chromium opens the listing page(s), finds PS5
#             console links, then reads stock from each product page.
#             Optional per-site keys: product_urls, interval_seconds, wait_ms, max_products,
#             in_stock_selector / out_of_stock_selector (CSS), watch_all, enabled
sites:
  # --- Official Sony Store Thailand (Shopify JSON feed: fast & reliable) ---
  # Off for the home PC: the feed answers HTTP 429 "too many requests" from our home IP. Tested 2026-11-25:
  # 429 on the first request, 200 once at 15:07, then 429 again on the first request of a 20 s trial at 15:18.
  # The home IP is also the one used to check out by hand, so don't poll Sony from it while it's limited.
  # GitHub Actions still checks it, because --site ignores `enabled` (and uses interval_seconds below).
  - name: Sony Store TH      # tested
    type: shopify
    enabled: false
    interval_seconds: 30
    urls:
      - https://store.sony.co.th/collections/playstation
      - https://store.sony.co.th/collections/console

  # --- Powerbuy: off. Cloudflare blocks automated checks even from a Thai home connection (tested 2026-11-25) ---
  - name: Powerbuy
    type: browser
    enabled: false
    urls:
      - https://www.powerbuy.co.th/th/category/game/game-console/playstation
      - https://www.powerbuy.co.th/en/category/game-vr/game-console/playstation-5
    # product_urls:          # optional: specific product pages to always check
    #   - https://www.powerbuy.co.th/th/product/....

  # --- JIB Computer Group (tested: product pages carry schema.org stock data) ---
  # Off for the home PC: GitHub Actions already checks JIB (--site ignores `enabled`); watching it from
  # both places would ping twice for one restock.
  - name: JIB
    type: browser
    enabled: false
    urls:
      - https://www.jib.co.th/web/product/product_search/0?str_search=playstation%205

  # --- Banana IT (official PlayStation retailer). Blocks GitHub's servers; works from a Thai home connection ---
  - name: Banana IT
    type: browser
    urls:
      - https://www.bnn.in.th/th/p/gaming-gear/console/playstation-0

  # --- dotlife: off. Cloudflare blocks automated checks even from a Thai home connection (tested 2026-11-25) ---
  - name: dotlife
    type: browser
    enabled: false
    urls:
      - https://www.dotlife.store/digital-lifestyle/gaming-toy/gaming-console.html?page=1&brand%5Bfilter%5D=SONY%2C481

  # --- Lazada (Sony official store). Heavy anti-bot / captcha: experimental ---
  - name: Lazada
    type: browser
    enabled: false
    wait_ms: 5000
    urls:
      - https://www.lazada.co.th/catalog/?q=playstation+5+console
